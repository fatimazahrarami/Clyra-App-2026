
name: Build Clyra APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          test -f main.py
          test -f buildozer.spec
          test -f icon.png

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clyra-APK
          path: bin/*.apk
          if-no-files-found: error
